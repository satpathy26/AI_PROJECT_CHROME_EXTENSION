<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI MCQ Solver</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <div class="logo-container">
            <img
                src="icons/logo.png"
                class="logo"
                alt="AI MCQ Solver"
            >
        </div>

        <h2>AI MCQ Solver</h2>

        <p class="subtitle">
            Highlight an MCQ and let AI solve it.
        </p>

        <button class="summarize">
            🚀 Solve Question
        </button>

        <!-- Loader -->
        <div class="loader hidden"></div>

        <!-- Status -->
        <p class="status">
            Ready
        </p>

        <!-- Output -->
        <div class="output">

            <h3>Answer</h3>

            <p class="text">
                The AI's answer will appear here...
            </p>

        </div>

    </div>

    <script src="popup.js"></script>

</body>
</html>
